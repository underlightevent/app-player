# Compilation automatique Windows + macOS.
# - À chaque modification : tests, vérification des licences, installateurs
#   téléchargeables dans l'onglet « Actions » (rubrique « Artifacts »).
# - Sur une étiquette de version (v0.1.0, v0.2.0…) : en plus, une version
#   publiée dans « Releases » avec ses installateurs.
# - Signature officielle : prête, mais inactive tant que les secrets ne sont
#   pas fournis (voir docs/SIGNATURE.md). Sans eux, macOS reçoit une signature
#   « ad hoc » (obligatoire pour les Mac Apple Silicon).
name: Compilation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust_targets: ""
            args: ""
            bundle_dir: src-tauri/target/release/bundle
          - name: macOS
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les licences (principe 12)
        run: |
          npm run licenses
          node scripts/check-rust-licenses.mjs

      - name: Vérifier les types
        run: npm run typecheck

      - name: Tests de l'interface
        run: npm test

      - name: Tests du cœur Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ---------- Signature officielle (inactive sans secrets) ----------
      - name: Signature macOS (Developer ID + notarisation)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Signature Windows (certificat de signature de code)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificat.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.windows.conf.json -Value $conf -Encoding utf8

      # ---------- Compilation et installateurs ----------
      - name: Compiler l'application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: DJ Library Manager ${{ github.ref_name }}
          releaseBody: |
            Installateurs de cette version :
            - Windows : fichier `.exe` (recommandé) ou `.msi`
            - macOS (Apple Silicon et Intel) : fichier `.dmg`

            L'application n'est pas encore signée : voir le README pour l'ouvrir malgré l'alerte de sécurité.
            Détail des changements : CHANGELOG.md.
          releaseDraft: false
          prerelease: false

      - name: Mettre les installateurs à disposition (onglet Actions)
        uses: actions/upload-artifact@v6
        with:
          name: installateur-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/dmg/*.dmg
