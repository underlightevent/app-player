[package]
name = "dj-library-manager"
version = "0.9.0"
description = "Gestionnaire de bibliothèque audio pour DJ"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "dj_library_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
lofty = "0.25"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "mp3", "flac", "aiff", "isomp4", "aac", "alac", "ogg", "vorbis"] }
notify = "9"
rayon = "1"
blake3 = "1"
walkdir = "2"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
base64 = "0.23"
regex = "1"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "json", "gzip"] }
rusty-chromaprint = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
strsim = "0.11"
rustfft = "6"
trash = "5"
quick-xml = "0.42"
sha2 = "0.10"
# Phase 8 : séparation des pistes (ONNX Runtime chargé à la demande, téléchargé avec accord).
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
flate2 = "1"
getrandom = "0.3"
ebur128 = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
