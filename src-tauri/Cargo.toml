[package]
name = "dj-library-manager"
version = "0.1.0"
description = "Gestionnaire de bibliothèque audio pour DJ"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "dj_library_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
